[tox]
isolated_build = true
envlist = py38, py39, py310, py311, py312, pyston-latest
skipsdist = true

[testenv]
deps = poetry
commands =
        poetry install -v  --with nlp,subtitles
        poetry run green -l -r -o *bottle*
setenv = 
    PYTHONASYNCIODEBUG = 1
    PYTHONHASHSEED = 0
allowlist_externals =
	poetry
[testenv:pyston-latest]
basepython = pyston
[flake8]
ignore = E501
exclude =
    .git,
    __pycache__,
    docs/source/conf.py,
    build,
    dist,
    .tox,
    misc,
per-file-ignores =
    pyborg/test/test_irc2.py:E128
max-complexity = 15
max-line-length = 140
